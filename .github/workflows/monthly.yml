name: Monthly Career Intelligence Digest & Scorecard

on:
  schedule:
    # 06:00 UTC on the 1st of every month = 07:00 Africa/Lagos WAT
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry Run (Simulate without sending real emails)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  monthly_digest:
    name: Generate Monthly Capability Scorecard & Trends
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Monthly Digest Pipeline
        env:
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m src.main run --type monthly --dry-run
          else
            python -m src.main run --type monthly
          fi

      - name: Commit & Persist Monthly Scorecard State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Career Intelligence Bot]"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(data): update monthly capability scorecard & trends [skip ci]"
            git push
          fi
